[package]
name = "operator-telegram"
description = "Operator Telegram bot (Rust rewrite)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "operator-telegram"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
operator-common = { workspace = true, features = ["media"] }

bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring", "native-tokio"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }
rand = "0.10.3"
regex = "1.13.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
