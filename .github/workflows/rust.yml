name: Rust

on:
  push:
    branches:
      - discord
      - telegram
      - 'rust/**'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  common-in-sync:
    # discord and telegram each carry a copy of src/common/; warn when the copies differ.
    # A warning, not a failure: right after pushing one branch the other is briefly behind.
    if: github.event_name == 'push' && (github.ref_name == 'discord' || github.ref_name == 'telegram')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare src/common/ with the other branch
        run: |
          other=$([ "$GITHUB_REF_NAME" = discord ] && echo telegram || echo discord)
          if git diff --quiet HEAD "origin/$other" -- src/common/; then
            echo "src/common/ matches $other"
          else
            echo "::warning title=src/common/ out of sync::src/common/ differs from $other - run scripts/sync-common.sh $GITHUB_REF_NAME"
            git diff --stat HEAD "origin/$other" -- src/common/
          fi
