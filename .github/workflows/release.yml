name: Release

# A release is published only when a tag is pushed on purpose, never automatically:
#   1. write the "## <version> - <Name>" section in CHANGELOG.md on that branch,
#   2. git tag discord-v1.2 discord && git push github discord-v1.2
#      git tag telegram-v1.2 telegram && git push github telegram-v1.2
# The release gets the title and description from CHANGELOG.md (no generated commit list),
# the compiled binary with its SHA256, and GitHub's source archives.
# It is created as a DRAFT after the binary passed a smoke test (--version shows the tagged
# commit). Download it from the draft, test it, then press "Publish release" on GitHub: the
# published file is exactly the tested one. scripts/deploy.sh only sees published releases.
on:
  push:
    tags:
      - 'discord-v*'
      - 'telegram-v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Ubuntu 22.04 links against glibc 2.35, so the binary also runs on newer servers
    # (the VPS has 2.41).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick the bot from the tag
        id: bot
        run: |
          case "$GITHUB_REF_NAME" in
            discord-v*) echo "package=operator-discord" >> "$GITHUB_OUTPUT" ;;
            telegram-v*) echo "package=operator-telegram" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected tag $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

      - name: Release notes from CHANGELOG.md
        run: |
          title=$(bash scripts/release-notes.sh "$GITHUB_REF_NAME" release-notes.md)
          echo "TITLE=$title" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        env:
          PACKAGE: ${{ steps.bot.outputs.package }}
        run: cargo build --release --locked -p "$PACKAGE"

      - name: Smoke test
        env:
          PACKAGE: ${{ steps.bot.outputs.package }}
        run: |
          version=$("target/release/$PACKAGE" --version)
          echo "$version"
          commit=$(git rev-parse --short=7 HEAD)
          case "$version" in
            "$PACKAGE "*"($commit)") ;;
            *) echo "expected $PACKAGE ... ($commit)" >&2; exit 1 ;;
          esac
          ldd "target/release/$PACKAGE"

      - name: Package
        env:
          PACKAGE: ${{ steps.bot.outputs.package }}
        run: |
          bin="$PACKAGE"
          out="$bin-$GITHUB_REF_NAME-x86_64-linux-gnu"
          cp "target/release/$bin" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          name: ${{ env.TITLE }}
          body_path: release-notes.md
          draft: true
